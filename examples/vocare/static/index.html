<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocare</title>
    <link rel="stylesheet" href="/static/graph-3d.css">
  </head>
  <body>
    <main class="app">
      <aside class="panel-left">
        <h1>Vocare</h1>

        <div class="mode-selector">
          <button id="modeDemoBtn" class="mode-btn active" type="button" data-mode="demo">DEMO</button>
          <button id="modeIndivBtn" class="mode-btn" type="button" data-mode="indiv">INDIV</button>
        </div>

        <div id="viewerBanner" class="viewer-banner"></div>
        <div id="callStatus" class="status">Aria is ready.</div>

        <div class="call-actions">
          <button id="callButton" class="btn primary" type="button">Call Aria</button>
          <button id="talkButton" class="btn" type="button" disabled>Hold to talk</button>
          <button id="hangupButton" class="btn danger" type="button" disabled>End call</button>
        </div>

        <button id="traceButton" class="btn ghost" type="button">Run graph demo</button>
        <button id="refreshButton" class="btn ghost" type="button">Refresh context</button>

        <label class="search-label" for="searchInput">Find context node</label>
        <input id="searchInput" type="search" placeholder="Search card, payment, address...">
        <input id="limitInput" type="hidden" value="2500">

        <section class="transcript-section">
          <div class="section-label">Transcript</div>
          <div id="callTranscript" class="transcript-messages"></div>
        </section>

        <section class="details-section">
          <div class="section-label">Selected context</div>
          <div id="selectionDetails" class="details">Connect or run the demo to expand Jack's context graph.</div>
        </section>
      </aside>

      <section class="panel-right">
        <div class="graph-header">
          <h2>Context Graph</h2>
          <div id="statusText" class="graph-status">Waiting for connection...</div>
        </div>

        <div class="graph-scene" id="graph">
          <canvas id="edgeCanvas"></canvas>
          <div id="graphWorld" class="graph-world"></div>
          <div id="graphPlaceholder" class="graph-placeholder">Call Aria or run the demo to reveal the context graph</div>
        </div>

        <div id="legend" class="graph-legend"></div>

        <div class="stats">
          <span><strong id="nodeCount">0</strong> nodes</span>
          <span><strong id="linkCount">0</strong> relationships</span>
        </div>

        <div id="accessPath" class="path-strip"></div>
      </section>
    </main>

    <script src="/static/graph-3d.js"></script>
  </body>
</html>
