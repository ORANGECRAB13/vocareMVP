services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vocare2026
    ports:
      - "8090:8080"
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/vocare2026
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
